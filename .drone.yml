kind: pipeline
type: docker
name: build-and-deploy

clone:
  depth: 1

steps:
  - name: build
    image: node:22-alpine
    pull: if-no-exits
    enviroment:
      GIT_TAG: ${DRONE_TAG:latest}
      MODE: release
    volumes:
      - name: dist-volume
        path: /dist
    commands:
      - chmod +x build.sh
      - ./build.sh

volumes:
  - name: dist-volume
    host:
      path: /home/web/dist # 主机上的路径，将映射到容器中的路径

when:
  ref:
    - refs/tags/*release

trigger:
  event:
    - tag
